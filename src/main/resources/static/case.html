<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试用例管理 - 自动化测试平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; height: 100vh; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* 自定义滚动条 */
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* 选中状态高亮 */
        .tree-node-content.active { @apply bg-indigo-50 text-indigo-700 border-r-2 border-indigo-600; }
        .tree-line { border-left: 1px dashed #cbd5e1; margin-left: 0.75rem; padding-left: 0.75rem; }
    </style>
</head>
<body class="flex flex-col text-slate-800">

<!-- 1. 顶部导航栏 -->
<nav class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 shadow-sm z-30 flex-shrink-0">
    <div class="flex items-center gap-4">
        <!-- 新增：返回首页按钮 -->
        <a href="/" class="flex items-center gap-2 text-slate-500 hover:text-indigo-600 transition group" title="回到首页">
            <div class="bg-slate-100 group-hover:bg-indigo-100 text-slate-500 group-hover:text-indigo-600 w-8 h-8 rounded-lg flex items-center justify-center transition">
                <i class="fas fa-home"></i>
            </div>
        </a>

        <div class="h-6 w-px bg-slate-200"></div>

        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white w-8 h-8 rounded-lg flex items-center justify-center shadow-md shadow-indigo-200">
                <i class="fas fa-database"></i>
            </div>
            <h1 class="font-bold text-xl tracking-tight text-slate-800">测试用例库</h1>
        </div>
    </div>

    <div class="flex items-center gap-3">
        <!-- 带参数返回首页，触发 index.html 的状态恢复 -->
        <a href="/?restore=true" class="text-slate-500 hover:text-indigo-600 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 hover:bg-slate-50">
            <i class="fas fa-arrow-left"></i> 返回生成结果
        </a>

        <div class="h-6 w-px bg-slate-200 mx-2"></div>

        <div class="flex gap-2">
            <button onclick="loadTestCases()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-2 rounded-lg text-sm font-medium transition" title="刷新列表">
                <i class="fas fa-sync-alt"></i>
            </button>
            <button onclick="batchRun()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm shadow-emerald-200 flex items-center gap-2">
                <i class="fas fa-play"></i> 批量执行
            </button>
            <button onclick="batchDelete()" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm shadow-rose-200 flex items-center gap-2">
                <i class="fas fa-trash-alt"></i> 批量删除
            </button>
        </div>
    </div>
</nav>

<!-- 2. 主体布局 -->
<main class="flex-1 flex overflow-hidden">

    <!-- 左侧：文件资源管理器 -->
    <aside class="w-80 bg-white border-r border-slate-200 flex flex-col flex-shrink-0 z-20">
        <!-- 统计栏 -->
        <div class="p-4 border-b border-slate-100 bg-slate-50/50 flex justify-between text-xs text-slate-500 font-medium">
            <span title="总文件数">Total: <b id="statTotal" class="text-indigo-600">0</b></span>
            <span title="文件夹">Dir: <b id="statFolders" class="text-slate-700">0</b></span>
            <span title="文件">File: <b id="statFiles" class="text-slate-700">0</b></span>
        </div>

        <!-- 工具栏 -->
        <div class="px-3 py-2 border-b border-slate-100 flex justify-between items-center bg-white">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider pl-2">File Explorer</span>
            <div class="flex gap-1">
                <button onclick="toggleSelectAll()" class="p-1.5 text-slate-400 hover:text-indigo-600 rounded hover:bg-slate-100 transition" title="全选/反选当前可见">
                    <i class="fas fa-check-double text-xs"></i>
                </button>
                <button onclick="collapseAll()" class="p-1.5 text-slate-400 hover:text-indigo-600 rounded hover:bg-slate-100 transition" title="全部折叠">
                    <i class="fas fa-compress-arrows-alt text-xs"></i>
                </button>
            </div>
        </div>

        <!-- 树形列表容器 -->
        <div id="treeContainer" class="flex-1 overflow-y-auto custom-scroll p-2 select-none">
            <!-- 加载状态 -->
            <div id="loadingState" class="flex flex-col items-center justify-center h-40 text-slate-400">
                <i class="fas fa-spinner fa-spin text-2xl mb-2 text-indigo-500"></i>
                <span class="text-sm">正在加载数据...</span>
            </div>
            <!-- 空状态 -->
            <div id="emptyState" class="hidden flex flex-col items-center justify-center h-40 text-slate-400">
                <i class="far fa-folder-open text-3xl mb-2"></i>
                <span class="text-sm">暂无测试用例</span>
            </div>
            <!-- 树根节点 -->
            <ul id="treeRoot" class="space-y-0.5 text-sm font-medium text-slate-600"></ul>
        </div>
    </aside>

    <!-- 右侧：编辑器与执行区 -->
    <section class="flex-1 flex flex-col bg-slate-50 min-w-0 relative">

        <!-- 未选择文件时的空状态 -->
        <div id="editorEmptyState" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 z-0">
            <div class="w-24 h-24 bg-white rounded-full shadow-sm border border-slate-200 flex items-center justify-center mb-6">
                <i class="fas fa-code text-4xl text-indigo-200"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-700">选择一个文件开始</h3>
            <p class="text-sm mt-2 text-slate-500">你可以查看代码、编辑内容或直接执行测试脚本</p>
        </div>

        <!-- 编辑器面板 (默认隐藏) -->
        <div id="editorPanel" class="flex-1 flex flex-col h-full hidden z-10 bg-white">

            <!-- 文件头部工具栏 -->
            <div class="h-12 border-b border-slate-200 bg-white flex items-center justify-between px-4 flex-shrink-0">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="bg-indigo-50 text-indigo-600 p-1.5 rounded">
                        <i class="fab fa-java text-lg"></i>
                    </div>
                    <span id="currentFileName" class="font-bold text-sm text-slate-700 truncate max-w-[300px]">TestClass.java</span>
                    <span id="fileUnsavedIndicator" class="hidden w-2 h-2 rounded-full bg-amber-500" title="未保存"></span>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="saveCurrentFile()" class="flex items-center gap-1.5 px-3 py-1.5 bg-white border border-slate-200 hover:border-indigo-300 hover:text-indigo-600 rounded text-sm font-medium transition text-slate-600">
                        <i class="fas fa-save"></i> 保存
                    </button>
                    <button onclick="runCurrentFile()" class="flex items-center gap-1.5 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-sm font-medium transition shadow-sm shadow-indigo-200">
                        <i class="fas fa-play"></i> 执行
                    </button>
                    <div class="h-4 w-px bg-slate-300 mx-1"></div>
                    <button onclick="deleteCurrentFile()" class="text-slate-400 hover:text-rose-500 p-2 transition" title="删除当前文件">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                    <button onclick="closeEditor()" class="text-slate-400 hover:text-slate-600 p-2 transition" title="关闭">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <!-- 代码编辑区 -->
            <div class="flex-1 relative">
                <textarea id="codeEditor" class="w-full h-full p-4 font-mono text-sm leading-6 resize-none outline-none text-slate-700 bg-white custom-scroll" spellcheck="false"></textarea>
            </div>

            <!-- 底部控制台 (可调整高度) -->
            <div id="consolePanel" class="border-t border-slate-200 bg-slate-50 flex flex-col transition-all duration-300 h-1/3 flex-shrink-0">
                <div class="flex items-center justify-between px-4 py-2 bg-slate-100 border-b border-slate-200 select-none cursor-pointer hover:bg-slate-200 transition" onclick="toggleConsole()">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-terminal text-slate-500 text-xs"></i>
                        <span class="text-xs font-bold text-slate-600 uppercase tracking-wider">Console Output</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="event.stopPropagation(); clearConsole()" class="text-xs text-slate-400 hover:text-slate-600 px-2">
                            <i class="fas fa-ban mr-1"></i> Clear
                        </button>
                        <i id="consoleToggleIcon" class="fas fa-chevron-down text-xs text-slate-400"></i>
                    </div>
                </div>
                <div id="consoleOutput" class="flex-1 p-4 font-mono text-xs overflow-y-auto custom-scroll whitespace-pre-wrap bg-slate-900 text-slate-300">
                    <span class="text-slate-500">// 等待执行结果...</span>
                </div>
            </div>
        </div>
    </section>
</main>

<!-- 全局提示框容器 -->
<div id="toast-container" class="fixed top-20 right-5 z-50 space-y-2 pointer-events-none"></div>

<script>
    // --- 全局状态 ---
    let treeData = [];
    let currentFilePath = null; // 相对路径
    let isFileDirty = false;    // 是否有未保存更改

    // --- 初始化 ---
    document.addEventListener('DOMContentLoaded', () => {
        loadTestCases();

        // 监听编辑器输入，标记未保存
        document.getElementById('codeEditor').addEventListener('input', () => {
            if(!isFileDirty) {
                isFileDirty = true;
                document.getElementById('fileUnsavedIndicator').classList.remove('hidden');
            }
        });
    });

    // --- 1. 数据加载与处理 ---
    async function loadTestCases() {
        const root = document.getElementById('treeRoot');
        const loading = document.getElementById('loadingState');
        const empty = document.getElementById('emptyState');

        // Reset UI
        root.innerHTML = '';
        loading.classList.remove('hidden');
        empty.classList.add('hidden');
        document.getElementById('statTotal').textContent = '0';
        document.getElementById('statFolders').textContent = '0';
        document.getElementById('statFiles').textContent = '0';

        try {
            const res = await fetch('/api/testcase/all');
            if(!res.ok) throw new Error("API Network Error");

            let data = await res.json();

            // 兼容性处理
            if (Array.isArray(data) && data.length > 0 && typeof data[0] === 'string') {
                data = data.map(str => {
                    try { return JSON.parse(str); } catch(e) { return null; }
                }).filter(i => i);
            }

            treeData = data;

            if (data.length === 0) {
                empty.classList.remove('hidden');
            } else {
                renderTree(data, root);
                updateStats(data);
            }

        } catch (e) {
            console.error(e);
            showMessage("无法加载文件列表: " + e.message, "error");
            empty.classList.remove('hidden');
        } finally {
            loading.classList.add('hidden');
        }
    }

    // --- 2. 树形结构渲染 ---
    function renderTree(nodes, container, level = 0) {
        nodes.forEach(node => {
            const li = document.createElement('li');
            const isFolder = node.type === 'dir' || node.type === 'folder';

            // 构建节点 UI
            const content = document.createElement('div');
            content.className = `tree-node-content flex items-center gap-2 py-1.5 px-2 rounded cursor-pointer hover:bg-slate-100 transition-colors ${!isFolder ? 'group' : ''}`;
            // 记录路径
            content.dataset.path = node.path;
            content.dataset.type = isFolder ? 'folder' : 'file';
            content.dataset.name = node.name;

            if (level > 0) content.style.paddingLeft = `${level * 12 + 8}px`;

            // 事件绑定
            if (isFolder) {
                content.onclick = (e) => {
                    e.stopPropagation();
                    toggleFolder(e.currentTarget, li);
                };
            } else {
                content.onclick = (e) => {
                    e.stopPropagation();
                    openFile(node.path, node.name, content);
                };
            }

            // 图标
            const iconClass = isFolder ? 'fas fa-folder text-amber-400' : 'fab fa-java text-indigo-500';
            const arrowIcon = isFolder ? `<i class="fas fa-chevron-right text-[10px] text-slate-300 transition-transform duration-200 arrow-icon mr-1"></i>` : `<span class="w-3 mr-1"></span>`;

            content.innerHTML = `
                ${arrowIcon}
                <input type="checkbox" class="node-checkbox w-3.5 h-3.5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 mr-1 cursor-pointer" onclick="event.stopPropagation()">
                <i class="${iconClass} w-4 text-center"></i>
                <span class="truncate flex-1">${node.name}</span>
            `;

            li.appendChild(content);

            // 递归渲染
            if (isFolder && node.children && node.children.length > 0) {
                const ul = document.createElement('ul');
                ul.className = "hidden tree-line"; // 默认折叠
                renderTree(node.children, ul, level + 1);
                li.appendChild(ul);
            }

            container.appendChild(li);
        });
    }

    // 文件夹展开/折叠
    function toggleFolder(element, liItem) {
        const ul = liItem.querySelector('ul');
        const arrow = element.querySelector('.arrow-icon');
        const folderIcon = element.querySelector('.fa-folder, .fa-folder-open');

        if (ul) {
            ul.classList.toggle('hidden');
            if(ul.classList.contains('hidden')) {
                arrow.classList.remove('rotate-90');
                folderIcon.classList.replace('fa-folder-open', 'fa-folder');
            } else {
                arrow.classList.add('rotate-90');
                folderIcon.classList.replace('fa-folder', 'fa-folder-open');
            }
        }
    }

    function collapseAll() {
        document.querySelectorAll('#treeRoot ul').forEach(ul => ul.classList.add('hidden'));
        document.querySelectorAll('.arrow-icon').forEach(i => i.classList.remove('rotate-90'));
        document.querySelectorAll('.fa-folder-open').forEach(i => i.classList.replace('fa-folder-open', 'fa-folder'));
    }

    // --- 3. 文件操作逻辑 ---

    async function openFile(fullPath, name, domElement) {
        if(isFileDirty && !confirm("当前文件有未保存的更改，是否放弃保存并打开新文件？")) {
            return;
        }

        document.querySelectorAll('.tree-node-content').forEach(el => el.classList.remove('active'));
        if(domElement) domElement.classList.add('active');

        document.getElementById('editorEmptyState').classList.add('hidden');
        document.getElementById('editorPanel').classList.remove('hidden');

        // 计算正确的相对路径 (防止 scripts/scripts 重复)
        currentFilePath = getRelativePath(fullPath);
        document.getElementById('currentFileName').textContent = name;
        isFileDirty = false;
        document.getElementById('fileUnsavedIndicator').classList.add('hidden');

        const editor = document.getElementById('codeEditor');
        editor.value = "正在读取文件...";
        editor.disabled = true;

        try {
            console.log("Requesting file:", currentFilePath);
            const res = await fetch(`/api/testcase/getfile?filepath=${encodeURIComponent(currentFilePath)}`);
            const data = await res.json();

            if(data.success) {
                editor.value = data.testCode;
            } else {
                editor.value = `// Error reading file: ${data.message}`;
                showMessage("读取失败: " + data.message, "error");
            }
        } catch(e) {
            editor.value = `// Network Error: ${e.message}`;
            showMessage("网络请求异常", "error");
        } finally {
            editor.disabled = false;
        }
    }

    async function saveCurrentFile() {
        if(!currentFilePath) return;
        const content = document.getElementById('codeEditor').value;

        try {
            showMessage("正在保存...", "info");
            const res = await fetch('/api/testcase/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filePath: currentFilePath, content: content })
            });
            const data = await res.json();

            if(data.success) {
                showMessage("文件已保存", "success");
                isFileDirty = false;
                document.getElementById('fileUnsavedIndicator').classList.add('hidden');
            } else {
                showMessage("保存失败: " + data.message, "error");
            }
        } catch(e) {
            showMessage("请求异常", "error");
        }
    }

    async function deleteCurrentFile() {
        if(!currentFilePath) return;
        if(!confirm(`确定要删除 ${currentFilePath} 吗？此操作不可恢复。`)) return;

        try {
            const res = await fetch(`/api/testcase/deletefile?filepath=${encodeURIComponent(currentFilePath)}`, { method: 'DELETE' });
            const data = await res.json();

            if(data.success) {
                showMessage("删除成功", "success");
                closeEditor();
                loadTestCases();
            } else {
                showMessage("删除失败: " + data.message, "error");
            }
        } catch(e) {
            showMessage("删除请求异常", "error");
        }
    }

    function closeEditor() {
        if(isFileDirty && !confirm("有未保存的更改，确定要关闭吗？")) return;
        document.getElementById('editorPanel').classList.add('hidden');
        document.getElementById('editorEmptyState').classList.remove('hidden');
        currentFilePath = null;
        isFileDirty = false;
        document.querySelectorAll('.active').forEach(el => el.classList.remove('active'));
    }

    // --- 4. 执行逻辑 ---

    async function runCurrentFile() {
        if(!currentFilePath) return;
        if(isFileDirty) {
            await saveCurrentFile();
        }

        const consolePanel = document.getElementById('consolePanel');
        if(consolePanel.classList.contains('h-10')) toggleConsole();

        logToConsole(`> 开始执行: ${currentFilePath} ...`, 'text-indigo-300');

        try {
            const res = await fetch('/api/execute/single', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ testCaseFileName: currentFilePath })
            });
            const data = await res.json();

            if(data.passed) {
                logToConsole(`> [SUCCESS] 测试通过`, 'text-emerald-400 font-bold');
            } else {
                logToConsole(`> [FAILED] 测试失败`, 'text-rose-400 font-bold');
                if(data.failureReason) logToConsole(`Reason: ${data.failureReason}`, 'text-rose-300');
            }

            if(data.outputText) {
                logToConsole("\n--- Output ---\n" + data.outputText, 'text-slate-300');
            }
            logToConsole("--------------------------------------------------\n", 'text-slate-500');

        } catch(e) {
            logToConsole(`> [ERROR] 请求异常: ${e.message}`, 'text-red-500');
        }
    }

    async function batchRun() {
        const paths = getSelectedFilePaths();
        if(paths.length === 0) return showMessage("请先在左侧勾选要执行的文件", "warning");

        showMessage(`开始批量执行 ${paths.length} 个文件...`, "info");

        document.getElementById('editorEmptyState').classList.add('hidden');
        document.getElementById('editorPanel').classList.remove('hidden');
        if(document.getElementById('consolePanel').classList.contains('h-10')) toggleConsole();

        logToConsole(`\n>>> 批量执行任务启动 (${paths.length} files) <<<`, 'text-amber-400 font-bold');

        try {
            const res = await fetch('/api/execute/batch', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(paths.map(p => ({testCaseFileName: p})))
            });
            const results = await res.json();

            if(Array.isArray(results)) {
                let passed = 0;
                results.forEach(r => {
                    if(r.passed) passed++;
                    const color = r.passed ? 'text-emerald-400' : 'text-rose-400';
                    const icon = r.passed ? '✔' : '✘';
                    const name = r.testCaseName || 'Unknown';
                    logToConsole(`[${icon}] ${name}`, color);
                });
                logToConsole(`>>> 任务结束: ${passed}/${results.length} 通过`, 'text-white font-bold bg-slate-700 p-1 inline-block mt-2');
                showMessage(`批量执行完成`, "success");
            } else {
                logToConsole("任务请求已发送，请查看后端日志。", "text-indigo-300");
            }

        } catch(e) {
            logToConsole(`>>> 批量执行异常: ${e.message}`, 'text-red-500');
        }
    }

    async function batchDelete() {
        const paths = getSelectedFilePaths();
        if(paths.length === 0) return showMessage("请先勾选要删除的文件", "warning");

        if(!confirm(`⚠️ 警告：确定要删除选中的 ${paths.length} 个文件吗？此操作不可恢复！`)) return;

        try {
            const query = paths.map(p => `filepath=${encodeURIComponent(p)}`).join('&');
            const res = await fetch(`/api/testcase/deletefiles?${query}`, { method: 'DELETE' });

            showMessage("批量删除请求已发送", "info");
            setTimeout(loadTestCases, 1000);
        } catch(e) {
            showMessage("删除请求失败", "error");
        }
    }

    // --- 5. 辅助功能 ---

    // 修复：处理路径中的 scripts 重复问题
    function getRelativePath(fullPath) {
        if (!fullPath) return null;

        let normalized = fullPath.replace(/\\/g, '/');
        const marker = "scripts";
        const idx = normalized.indexOf(marker);

        // 如果包含 scripts，只截取它后面的部分
        if (idx !== -1) {
            // 例: .../scripts/case_generated/test.java -> case_generated/test.java
            let relative = normalized.substring(idx + marker.length);
            if(relative.startsWith('/')) {
                relative = relative.substring(1);
            }
            return relative;
        }

        return normalized;
    }

    function updateStats(data) {
        let files = 0, folders = 0;
        function traverse(nodes) {
            nodes.forEach(n => {
                if(n.type === 'dir' || n.type === 'folder') {
                    folders++;
                    if(n.children) traverse(n.children);
                } else {
                    files++;
                }
            });
        }
        traverse(data);
        document.getElementById('statTotal').innerText = files + folders;
        document.getElementById('statFiles').innerText = files;
        document.getElementById('statFolders').innerText = folders;
    }

    function getSelectedFilePaths() {
        const paths = [];
        document.querySelectorAll('.node-checkbox:checked').forEach(cb => {
            const row = cb.closest('.tree-node-content');
            const type = row.dataset.type;
            const path = row.dataset.path;

            if(type === 'file' && path) {
                paths.push(getRelativePath(path));
            }
        });
        return [...new Set(paths)];
    }

    function toggleSelectAll() {
        const checkboxes = document.querySelectorAll('.node-checkbox');
        const allChecked = Array.from(checkboxes).every(c => c.checked);
        checkboxes.forEach(c => c.checked = !allChecked);
    }

    function toggleConsole() {
        const panel = document.getElementById('consolePanel');
        const icon = document.getElementById('consoleToggleIcon');

        if (panel.classList.contains('h-10')) {
            panel.classList.remove('h-10');
            panel.classList.add('h-1/3');
            icon.classList.remove('rotate-180');
        } else {
            panel.classList.remove('h-1/3');
            panel.classList.add('h-10');
            icon.classList.add('rotate-180');
        }
    }

    function clearConsole() {
        document.getElementById('consoleOutput').innerHTML = '<span class="text-slate-500">// Console cleared</span>';
    }

    function logToConsole(msg, classNames = '') {
        const out = document.getElementById('consoleOutput');
        const line = document.createElement('div');
        line.className = classNames;
        line.textContent = msg;
        out.appendChild(line);
        out.scrollTop = out.scrollHeight;
    }

    function showMessage(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');

        const typeStyles = {
            success: 'bg-emerald-500 border-emerald-600 text-white',
            error: 'bg-rose-500 border-rose-600 text-white',
            warning: 'bg-amber-500 border-amber-600 text-white',
            info: 'bg-indigo-500 border-indigo-600 text-white'
        };
        const icons = {
            success: 'fa-check-circle',
            error: 'fa-times-circle',
            warning: 'fa-exclamation-triangle',
            info: 'fa-info-circle'
        };

        toast.className = `${typeStyles[type]} px-4 py-3 rounded shadow-lg flex items-center gap-3 min-w-[300px] transform transition-all duration-300 translate-x-10 opacity-0 pointer-events-auto`;
        toast.innerHTML = `<i class="fas ${icons[type]} text-lg"></i><span class="font-medium text-sm">${message}</span>`;

        container.appendChild(toast);

        requestAnimationFrame(() => toast.classList.remove('translate-x-10', 'opacity-0'));

        setTimeout(() => {
            toast.classList.add('translate-x-10', 'opacity-0');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

</script>
</body>
</html>
